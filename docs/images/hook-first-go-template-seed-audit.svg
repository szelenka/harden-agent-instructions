<text x="398" y="647" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Evidence</text>
<line x1="28" y1="656" x2="892" y2="656" stroke="#30363d"/>
<text x="38" y="671" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Source Control</text>
<text x="38" y="683" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Workflow</text>
<text x="248" y="671" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Unverified</text>
<text x="398" y="671" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">No .git metadata was available; prior branch/commit rules</text>
<text x="398" y="683" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">in AGENTS.md were removed because they could not be</text>
<text x="398" y="695" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">verified.</text>
<text x="28" y="735" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400">Verification: go test ./... passed and go vet ./... passed when run with a workspace-local GOCACHE because</text>
<text x="28" y="755" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400">the sandbox blocks Go’s default cache path under the user home directory.</text>
