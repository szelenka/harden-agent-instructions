[project]
name = "tox-django"
version = "0.1.0"
description = "A Django app with tox-managed test environments"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "src.settings"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true
